[project]
name = "edip-backend"
version = "0.1.0"
description = "Enterprise Document Intelligence Platform — backend (secure, multi-deployment RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    # Phase C: content connectors — outbound HTTP (URL import + Notion API) + HTML→text.
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Phase 1: ingestion + vector search
    "pgvector>=0.3",
    "openai>=1.40",
    "llama-index-core>=0.11",
    "tiktoken>=0.7",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "boto3>=1.34",
    # Phase 3: multi-agent workflow + LLM
    "langgraph>=0.2",
    "anthropic>=0.40",
    # Phase D: outbound transactional email (invites + password reset). Pure-Python,
    # works against any SMTP relay (SES/Mailgun/Postmark/self-hosted).
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
# Cross-encoder re-ranking. Heavy (pulls torch + downloads model weights), so it is
# opt-in: install with `uv sync --extra reranker`. Without it, the FakeReranker is used.
reranker = ["sentence-transformers>=3.0"]
# RAGAS evaluation. Heavy (pulls langchain + datasets) and needs an LLM judge, so it is
# opt-in: install with `uv sync --extra evals`. Without it, the FakeEvaluator is used and
# the deterministic eval gate still runs offline.
evals = ["ragas>=0.2", "datasets>=2.0", "langchain-anthropic>=0.2", "langchain-openai>=0.2"]
# Langfuse tracing (Phase 6). Opt-in: `uv sync --extra observability`. Without it the
# FakeTracer (no-op + structured logs) is used and the workflow/tests run offline.
observability = ["langfuse>=2.0"]
# MCP server (Phase 6). Opt-in: `uv sync --extra mcp`. The tool logic is tested without
# the SDK; this extra is only needed to actually run mcp_server/server.py over stdio.
mcp = ["mcp>=1.2"]
# In-process local embeddings (Phase 7). Opt-in: `uv sync --extra local`. Pulls
# sentence-transformers (+ torch) so air-gapped deployments can embed without any
# embedding server. Without it, EMBEDDING_PROVIDER=sentence_transformers falls back to
# fake in development (the prod validator refuses the silent downgrade outside it).
local = ["sentence-transformers>=3.0"]
# Phase D: Stripe billing. Opt-in: `uv sync --extra billing`. The SDK is lazy-imported
# only inside StripeBillingProvider, so the default install + offline test suite use the
# FakeBillingProvider and never need Stripe or its keys.
billing = ["stripe>=9.0"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is idiomatic.
    "UP042",  # `str, enum.Enum` is an intentional, widely-used pattern here.
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are expected; long lines and test-only "secrets" are fine.
"tests/*" = ["S101", "S105", "S106", "E501"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
    "pgvector.*",
    "llama_index.*",
    "pypdf.*",
    "docx.*",
    "bs4.*",
    "boto3.*",
    "botocore.*",
    "sentence_transformers.*",
    "langgraph.*",
    "langchain_core.*",
    "ragas.*",
    "datasets.*",
    "langchain_anthropic.*",
    "langchain_openai.*",
    "langchain.*",
    "langfuse.*",
    "mcp.*",
    "aiosmtplib.*",
    "stripe.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ragas: real RAGAS evaluation (needs the [evals] extra + ANTHROPIC_API_KEY); skipped by default",
]

# Fly.io config for the Sales Assistant backend (Phase D hosted deploy).
# Deploy from the backend/ directory so the Dockerfile + build context resolve:
#   cd backend && fly deploy -c ../deploy/fly/backend.fly.toml
# Rename `app` to your Fly app. Secrets (JWT_SECRET_KEY, MASTER_KEK, OPENAI_API_KEY,
# STRIPE_*, SMTP_*, DATABASE_URL) are set with `fly secrets set` — never put them here.
# See deploy/fly/README.md for the full runbook.

app = "sales-assistant-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Run migrations on every release, before the new machines take traffic.
[deploy]
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  DEPLOYMENT_MODE = "saas"
  # Fly machine disk is ephemeral — store documents in S3-compatible object storage
  # (e.g. Fly Tigris). Set S3_* via `fly secrets set`.
  STORAGE_BACKEND = "s3"
  # Hosted SaaS posture.
  ENABLE_SIGNUP = "true"
  ENABLE_BILLING = "true"
  EMAIL_PROVIDER = "smtp"
  BILLING_PROVIDER = "stripe"
  # Enterprise-only surfaces stay off in the v1 product.
  ENABLE_COMPLIANCE = "false"
  ENABLE_EVALS = "false"
  ENABLE_HUMAN_REVIEW = "false"
  ENABLE_CONNECTORS = "false"
  # FRONTEND_BASE_URL and CORS_ALLOW_ORIGINS must point at the deployed frontend origin;
  # set them with `fly secrets set` (they vary per environment).

[http_service]
  internal_port = 8000
  force_https = true
  # Ingestion runs in-process via FastAPI BackgroundTasks, so keep one machine always on
  # (don't let Fly stop it mid-ingestion). Celery/Redis is the scaling follow-up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
